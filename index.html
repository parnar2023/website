<!DOCTYPE html>
<html>
<head>
    <title>Rocket League Tournament</title>

    <style>
        section {
            background-color: gold;
            color: chartreuse;

        }

        img {
            width: 500px;

        table {
            background-color: gold;

            align-items: center;
        }
    </style>

    <script type="module">
        /* -------------------- FIREBASE SETUP -------------------- */
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA0T3pnUvMgrNjmbYbTnetaxjtWCb55Y7Y",
            authDomain: "website-f6d0f.firebaseapp.com",
            databaseURL: "https://website-f6d0f-default-rtdb.firebaseio.com",

            messagingSenderId: "800099865387",
            appId: "1:800099865387:web:8430a2c3bddb071d236b6e",
            measurementId: "G-G8HTF5580X"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let teams = [];
        let stats = {};

        /* ---------- SYNC HELPERS ---------- */

        function saveData() {
            set(
                ref(db, "tournament"),
                {
                    teams,
                    stats,
                    matchesHTML: document.getElementById("matches").innerHTML
                }
            );
        }

        function loadData() {
            onValue(ref(db, "tournament"), (snapshot) => {
                if (!snapshot.exists()) return;

                const data = snapshot.val();

                teams = data.teams || [];
                stats = data.stats || {};
                document.getElementById("matches").innerHTML = data.matchesHTML || "";

                renderTeamList();
                updateDropdowns();
                renderTable();
            });
        }

        /* ---------- ORIGINAL LOGIC ---------- */

        function renderTeamList() {
            const list = document.getElementById("teamList");
            list.innerHTML = "";
            for (let t of teams) {
                list.innerHTML += "<li>" + t + "</li>";
            }
        }

        window.addTeam = function () {
            const name = document.getElementById("teamName").value;
            if (name === "") return;

            teams.push(name);
            renderTeamList();
            updateDropdowns();

            document.getElementById("teamName").value = "";

            saveData();
        };

        function updateDropdowns() {
            const t1 = document.getElementById("team1");
            const t2 = document.getElementById("team2");

            t1.innerHTML = "";
            t2.innerHTML = "";

            for (let t of teams) {
                t1.innerHTML += "<option>" + t + "</option>";
                t2.innerHTML += "<option>" + t + "</option>";
            }
        }

        function initTeam(team) {
            if (!stats[team]) {
                stats[team] = {
                    played: 0,
                    won: 0,
                    lost: 0,
                    points: 0
                };
            }
        }

        window.addMatch = function () {
            const team1 = document.getElementById("team1").value;
            const team2 = document.getElementById("team2").value;

            const score1 = Number(document.getElementById("score1").value);
            const score2 = Number(document.getElementById("score2").value);

            if (team1 === team2) {
                alert("Teams must be different!");
                return;
            }

            initTeam(team1);
            initTeam(team2);

            stats[team1].played++;
            stats[team2].played++;
